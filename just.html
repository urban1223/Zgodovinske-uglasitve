<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Naravna</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { 
            --bg: #0d0d10; --panel: #141b29; --amber: #f2cc5a; 
            --text: #e8e0d0; --green: #4cdb7a; --red: #e05050;
            --bg-black: #000000;
        }
        body { 
            background: var(--bg-black); 
            color: var(--text); 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 15px; 
            margin: 0; 
            min-height: 100vh;
            justify-content: center;
            overflow-x: hidden; /* Fiksira zaslon, da se ne premika levo-desno */
            box-sizing: border-box;
            position: relative;
        }

        /* 85% črna zatemnitev slike samo v ozadju celotne strani */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('ozadje.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-black);
            opacity: 0.85; /* Natanko 85% zatemnitev */
            z-index: -1;
        }

        .panel { 
            background: var(--panel); 
            padding: 30px; 
            border-radius: 35px; 
            width: 100%; 
            max-width: 550px; 
            text-align: center; 
            border: 1px solid #2a2a35; 
            box-sizing: border-box; /* Prepreči širjenje čez robove telefona */
        }

        /* Unified Gauge System */
        .gauge-container { 
            position: relative; width: 100%; height: 220px; margin-top: 10px; 
            background: var(--bg); border-radius: 20px; border: 1px solid #334; overflow: hidden;
            box-sizing: border-box;
        }
        .needle { 
            width: 3px; height: 160px; background: var(--amber); 
            position: absolute; left: 50%; bottom: 20px; 
            transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); 
            z-index: 10; box-shadow: 0 0 15px var(--amber);
            transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .marker { position: absolute; width: 2px; height: 15px; background: #445; left: 50%; bottom: 20px; transform-origin: bottom center; }
        .marker.zero { background: var(--green); height: 25px; width: 3px; box-shadow: 0 0 10px var(--green); }
        .marker-label { position: absolute; font-size: 11px; color: #556; width: 40px; text-align: center; left: 50%; bottom: 20px; transform-origin: bottom center; font-family: monospace; }

        .big-note { font-size: 100px; font-weight: 900; color: var(--amber); margin: 5px 0; letter-spacing: -3px; }
        
        /* Stats Row - Unified with others */
        .stats-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .cents-val { font-size: 20px; font-weight: bold; font-family: monospace; color: var(--amber); }
        .hz-display { font-size: 14px; color: #556; font-family: monospace; align-self: center; }

        /* Settings with Bold Text */
        .settings-bar { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--bg); padding: 15px; border-radius: 15px; margin: 15px 0; gap: 10px; border: 1px solid #2a2a35; align-items: end; box-sizing: border-box; }
        .setting-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        label { font-size: 9px; color: #889; text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: #141b29; border: 1px solid #445; color: var(--amber); padding: 8px; border-radius: 5px; text-align: center; width: 100%; font-size: 14px; outline: none; font-weight: bold; box-sizing: border-box; }
        
        .mic-btn { width: 100%; padding: 18px; border-radius: 15px; border: 2px solid var(--amber); background: transparent; color: var(--amber); cursor: pointer; font-weight: bold; margin-bottom: 20px; font-size: 16px; transition: 0.2s; box-sizing: border-box; }
        .refresh-btn { background: var(--amber); color: #000; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 11px; width: 100%; box-sizing: border-box; }

        /* Enharmonic Controls */
        .enharmonic-selector { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 15px; border: 1px solid #2a2a35; box-sizing: border-box; }
        .toggle-group { display: flex; flex-direction: column; gap: 4px; }
        .enh-btn { background: #141b29; border: 1px solid #334; color: #889; padding: 6px 2px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; transition: 0.2s; }
        .enh-btn.active { background: var(--amber); color: #000; border-color: var(--amber); }

        .keyboard { 
            display: grid; 
            grid-template-columns: repeat(6, 1fr); 
            gap: 10px; 
            margin-top: 10px; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .key { 
            background: #141b29; 
            border: 1px solid #334; 
            padding: 22px 0; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold; 
            color: #aaa; 
            transition: 0.1s; 
            box-sizing: border-box; 
            width: 100%;
        }
        .key.playing { background: var(--amber); color: #000; border-color: var(--amber); box-shadow: 0 0 15px var(--amber); }

        .oct-ctrl { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 11px; margin-top: 8px; opacity: 0.7; user-select: none; }
        .oct-arrow { padding: 4px 6px; cursor: pointer; transition: color 0.1s; font-size: 12px; }
        .oct-arrow:hover { color: var(--amber); }
        .key.playing .oct-arrow:hover { color: #000; }

        @media (max-width: 500px) {
            .panel { padding: 20px 12px; }
            .keyboard { gap: 6px; }
            .key { padding: 18px 0; font-size: 15px; }
            .oct-ctrl { gap: 4px; font-size: 10px; }
            .oct-arrow { padding: 4px; }
        }
    </style>
</head>
<body>

<div class="panel">
    <div style="font-size: 10px; letter-spacing: 4px; color: #556; margin-bottom: 10px;">Naravna uglasitev</div>

    <div class="gauge-container">
        <div id="markers"></div>
        <div class="needle" id="needle"></div>
    </div>

    <div class="big-note" id="note-name">--</div>
    
    <div class="stats-row">
        <div class="cents-val" id="cents-display">0.0 ¢</div>
        <div class="hz-display" id="hz-display">0.00 Hz</div>
    </div>
    
    <button id="mic-btn" class="mic-btn" onclick="toggleMic()">VKLJUČI MIKROFON</button>

    <div class="settings-bar">
        <div class="setting-item">
            <label>Referenca A</label>
            <input type="number" id="a-ref" value="415" step="0.1" oninput="updateAll()">
        </div>
        <div class="setting-item">
            <label>Valovanje</label>
            <select id="wave-type" onchange="updateAll()">
                <option value="triangle" selected>Trikotno</option>
                <option value="sine">Sinusno</option>
                <option value="sawtooth">Žagasto</option>
            </select>
        </div>
        <div class="setting-item">
            <label>Sistem</label>
            <button class="refresh-btn" onclick="updateAll()">Osveži</button>
        </div>
    </div>

    <div class="enharmonic-selector">
        <div class="toggle-group">
            <button class="enh-btn active" id="e1u" onclick="setEnh(1,'C♯',1.0417,'e1u','e1d')">C♯</button>
            <button class="enh-btn" id="e1d" onclick="setEnh(1,'D♭',1.0667,'e1d','e1u')">D♭</button>
        </div>
        <div class="toggle-group">
            <button class="enh-btn" id="e3u" onclick="setEnh(3,'E♭',1.2,'e3u','e3d')">E♭</button>
            <button class="enh-btn active" id="e3d" onclick="setEnh(3,'D♯',1.1719,'e3d','e3u')">D♯</button>
        </div>
        <div class="toggle-group">
            <button class="enh-btn active" id="e6u" onclick="setEnh(6,'F♯',1.3887,'e6u','e6d')">F♯</button>
            <button class="enh-btn" id="e6d" onclick="setEnh(6,'G♭',1.4063,'e6d','e6u')">G♭</button>
        </div>
        <div class="toggle-group">
            <button class="enh-btn active" id="e8u" onclick="setEnh(8,'G♯',1.6,'e8u','e8d')">G♯</button>
            <button class="enh-btn" id="e8d" onclick="setEnh(8,'A♭',1.5625,'e8d','e8u')">A♭</button>
        </div>
        <div class="toggle-group">
            <button class="enh-btn active" id="e10u" onclick="setEnh(10,'B♭',1.7778,'e10u','e10d')">B♭</button>
            <button class="enh-btn" id="e10d" onclick="setEnh(10,'A♯',1.7361,'e10d','e10u')">A♯</button>
        </div>
    </div>

    <div class="keyboard" id="kb"></div>
</div>

<script>
let audioCtx, analyser, micStream;
let baseC = 415 / 1.6667; 
let noteOctaves = [3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3];
let currentNeedleAngle = 0;
let noteNames = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "B♭", "B"];
let ratios = [1, 1.0417, 1.1111, 1.1719, 1.25, 1.3333, 1.3887, 1.5, 1.6, 1.6667, 1.7778, 1.875];
let activeOscs = {};

function init() {
    const markersDiv = document.getElementById('markers');
    for (let i = -50; i <= 50; i += 10) {
        const m = document.createElement('div');
        m.className = 'marker' + (i === 0 ? ' zero' : '');
        m.style.transform = `translateX(-50%) rotate(${i}deg) translateY(-165px)`;
        markersDiv.appendChild(m);
        
        const l = document.createElement('div');
        l.className = 'marker-label';
        l.innerText = i === 0 ? "0" : (i > 0 ? "+" + i : i);
        l.style.transform = `translateX(-50%) rotate(${i}deg) translateY(-135px)`;
        markersDiv.appendChild(l);
    }
    updateAll();
    renderKeyboard();
}

function updateAll() {
    let aVal = parseFloat(document.getElementById('a-ref').value) || 415;
    baseC = aVal / 1.6667; 
    const wType = document.getElementById('wave-type').value;

    Object.keys(activeOscs).forEach(idx => {
        activeOscs[idx].osc.frequency.setTargetAtTime(getFreq(idx), audioCtx.currentTime, 0.03);
        activeOscs[idx].osc.type = wType;
    });
}

function setEnh(idx, name, ratio, act, inact) {
    noteNames[idx] = name;
    ratios[idx] = ratio;
    document.getElementById(act).classList.add('active');
    document.getElementById(inact).classList.remove('active');
    updateAll();
    renderKeyboard();
}

function changeNoteOctave(idx, dir, event) {
    if (event) event.stopPropagation();
    noteOctaves[idx] = Math.max(1, Math.min(6, noteOctaves[idx] + dir));
    
    document.getElementById(`oct-val-${idx}`).innerText = noteOctaves[idx];
    
    if (activeOscs[idx]) {
        activeOscs[idx].osc.frequency.setTargetAtTime(getFreq(idx), audioCtx.currentTime, 0.03);
    }
}

function renderKeyboard() {
    const kb = document.getElementById('kb');
    kb.innerHTML = '';
    noteNames.forEach((name, i) => {
        const btn = document.createElement('button');
        btn.className = 'key' + (activeOscs[i] ? ' playing' : '');
        btn.id = 'key-' + i;
        btn.onclick = () => toggleTone(i);
        
        btn.innerHTML = `
            <div>${name}</div>
            <div class="oct-ctrl">
                <span class="oct-arrow" onclick="changeNoteOctave(${i}, -1, event)">▼</span>
                <span id="oct-val-${i}" style="font-family: monospace; font-weight: bold;">${noteOctaves[i]}</span>
                <span class="oct-arrow" onclick="changeNoteOctave(${i}, 1, event)">▲</span>
            </div>
        `;
        kb.appendChild(btn);
    });
}

function getFreq(idx) {
    return baseC * ratios[idx] * Math.pow(2, noteOctaves[idx] - 3);
}

function toggleTone(idx) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (activeOscs[idx]) {
        activeOscs[idx].gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.05);
        activeOscs[idx].osc.stop(audioCtx.currentTime + 0.1);
        delete activeOscs[idx];
        document.getElementById('key-' + idx).classList.remove('playing');
    } else {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = document.getElementById('wave-type').value;
        osc.frequency.setValueAtTime(getFreq(idx), audioCtx.currentTime);
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.15, audioCtx.currentTime + 0.05);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        activeOscs[idx] = { osc, gain };
        document.getElementById('key-' + idx).classList.add('playing');
    }
}

async function toggleMic() {
    const btn = document.getElementById('mic-btn');
    if (analyser) { 
        analyser = null; 
        if(micStream) micStream.getTracks().forEach(t => t.stop());
        btn.innerText = "TURN ON"; return; 
    }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 4096;
        source.connect(analyser);
        btn.innerText = "TURN OFF";
        draw();
    } catch (e) { alert("Acces to mic is denied."); }
}

function autoCorrelate(buf, sampleRate) {
    let rms = 0; for (let i=0; i<buf.length; i++) rms += buf[i]*buf[i];
    if (Math.sqrt(rms/buf.length) < 0.015) return -1;
    let n = buf.length, correlations = new Float32Array(n);
    for (let offset=0; offset<n; offset++) {
        for (let i=0; i<n-offset; i++) correlations[offset] += buf[i]*buf[i+offset];
    }
    let d=0; while (correlations[d] > correlations[d+1]) d++;
    let maxV=-1, maxP=-1;
    for (let i=d; i<n; i++) { if (correlations[i]>maxV) { maxV=correlations[i]; maxP=i; } }
    let x0=correlations[maxP-1], x1=correlations[maxP], x2=correlations[maxP+1];
    let a=(x0+x2-2*x1)/2, b=(x2-x0)/2;
    return a === 0 ? -1 : sampleRate / (maxP - b/(2*a));
}

function draw() {
    if (!analyser) return;
    const buffer = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buffer);
    let freq = autoCorrelate(buffer, audioCtx.sampleRate);
    
    if (freq !== -1 && isFinite(freq)) {
        let closestIdx=0, minHz=Infinity, targetCents=0;
        for (let i=0; i<12; i++) {
            let bF = baseC * ratios[i];
            for (let oct=-3; oct<=3; oct++) {
                let target = bF * Math.pow(2, oct);
                let diff = Math.abs(freq - target);
                if (diff < minHz) { 
                    minHz = diff; closestIdx = i; 
                    targetCents = 1200 * Math.log2(freq / target); 
                }
            }
        }

        currentNeedleAngle += (targetCents - currentNeedleAngle) * 0.20;
        const needleEl = document.getElementById('needle');
        const noteEl = document.getElementById('note-name');
        const cd = document.getElementById('cents-display');
        const hzDisplay = document.getElementById('hz-display');
        
        let displayAngle = Math.max(-50, Math.min(50, currentNeedleAngle));
        needleEl.style.transform = `translateX(-50%) rotate(${displayAngle}deg)`;
        noteEl.textContent = noteNames[closestIdx];

        if (Math.abs(targetCents) < 1.5) {
            noteEl.style.color = "var(--green)";
            needleEl.style.background = "var(--green)";
            cd.style.color = "var(--green)";
        } else {
            noteEl.style.color = "var(--amber)";
            needleEl.style.background = "var(--amber)";
            cd.style.color = "var(--amber)";
        }
        cd.textContent = (targetCents > 0 ? "+" : "") + targetCents.toFixed(1) + " ¢";
        hzDisplay.textContent = freq.toFixed(2) + " Hz";
    }
    requestAnimationFrame(draw);
}

init();
</script>
</body>
</html>
